version: '3.8'


services:
  db:
    build: ./db
    container_name: mysql_container
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${PASS}
      MYSQL_DATABASE: test_db
    ports:
      - "3309:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${PASS}"]
      interval: 5s
      timeout: 3s
      retries: 5



  back:
    build: ./back
    container_name: node
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=${PASS}
      - DB_NAME=test_db
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./front
    container_name: nginx
    restart: always
    ports:
      - "8077:80"
    depends_on:
      - back

volumes:
  db_data: 
